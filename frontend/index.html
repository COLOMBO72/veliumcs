      link.rel = "canonical";
      link.href = location.origin + location.pathname;
      document.head.appendChild(link);
    </script>
    <meta

    <link rel="canonical" href="https://cs2scope.gg/" />

      property="og:title"
      content="VELIUMCS — CS2 Player Stats &amp; FACEIT ELO Tracker"
